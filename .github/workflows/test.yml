name: Verify plugin
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
jobs:
  unit-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install '.[test]' ruff
      - run: python -m pytest -q
      - run: ruff check inventree_universal_importer tests --select F
      - run: npm ci && npm run build && npm test
        working-directory: frontend
      - run: git diff --exit-code -- inventree_universal_importer/static
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
  inventree-integration:
    strategy:
      fail-fast: false
      matrix:
        inventree: ['1.5.6', '1.5.7', '1.6.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: inventree/InvenTree
          ref: ${{ matrix.inventree }}
          path: _inventree
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libxmlsec1-dev libxmlsec1-openssl
      - run: python -m pip install -r _inventree/src/backend/requirements.txt
      - run: python -m pip install '.[test]'
      - run: python tools/integration_check.py --inventree-root _inventree
